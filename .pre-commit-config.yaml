repos:
  # Use pre-commit-hooks for basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Python formatting and linting
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        exclude: '(proto/|.*_pb2\.py|.*_pb2_grpc\.py|.*_pb2\.pyi|_proto_generation_info\.py)$'

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: '(proto/|.*_pb2\.py|.*_pb2_grpc\.py|.*_pb2\.pyi|_proto_generation_info\.py)$'

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=88', '--extend-ignore=E203,W503']
        exclude: '(proto/|.*_pb2\.py|.*_pb2_grpc\.py|.*_pb2\.pyi|_proto_generation_info\.py)$'

  # Type checking (optional - can be slow)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--ignore-missing-imports']
        exclude: '(^proto/|^examples/|.*_pb2\.py|.*_pb2_grpc\.py|.*_pb2\.pyi|_proto_generation_info\.py)'
        additional_dependencies: [types-pyyaml, types-protobuf]

# Configuration for all hooks
default_language_version:
  python: python3.12

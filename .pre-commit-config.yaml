repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        exclude: '(proto/|joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|local_joblet_pb2\.pyi|_proto_generation_info\.py)$'
        args: ['--extend-exclude', 'proto/|joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|local_joblet_pb2\.pyi|_proto_generation_info\.py']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: '(proto/|joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|local_joblet_pb2\.pyi|_proto_generation_info\.py)$'
        args: ['--skip', 'joblet_pb2.py', '--skip', 'joblet_pb2_grpc.py', '--skip', 'joblet_pb2.pyi', '--skip', 'local_joblet_pb2.pyi', '--skip', '_proto_generation_info.py', '--extend-skip', 'proto/']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: '(proto/|joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|local_joblet_pb2\.pyi|_proto_generation_info\.py)$'
        args: ['--max-line-length=88', '--extend-ignore=E203,W503', '--exclude=proto/,joblet_pb2.py,joblet_pb2_grpc.py,joblet_pb2.pyi,local_joblet_pb2.pyi,_proto_generation_info.py', '--show-source', '--statistics']

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        types: [python]
        exclude: '(proto/|joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|local_joblet_pb2\.pyi|_proto_generation_info\.py)$'
        args: ['--ignore-missing-imports']
        additional_dependencies: [types-PyYAML]
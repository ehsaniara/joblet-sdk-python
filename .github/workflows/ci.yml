name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting
        run: |
          echo "Checking code formatting..."

          # Check if formatting is needed
          if ! black --check joblet/ examples/ scripts/ --extend-exclude "joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|_proto_generation_info\.py"; then
            echo "❌ Code formatting issues found."
            echo "💡 To fix locally, run: black joblet/ examples/ scripts/ --extend-exclude \"joblet_pb2\.py|joblet_pb2_grpc\.py|joblet_pb2\.pyi|_proto_generation_info\.py\""
            exit 1
          fi

          # Check if import sorting is needed
          if ! isort --check-only joblet/ examples/ scripts/ --skip joblet_pb2.py --skip joblet_pb2_grpc.py --skip joblet_pb2.pyi --skip _proto_generation_info.py; then
            echo "❌ Import sorting issues found."
            echo "💡 To fix locally, run: isort joblet/ examples/ scripts/ --skip joblet_pb2.py --skip joblet_pb2_grpc.py --skip joblet_pb2.pyi --skip _proto_generation_info.py"
            exit 1
          fi

          echo "✅ Code formatting looks good!"

      - name: Lint with flake8
        run: |
          # Run basic linting for critical errors
          flake8 joblet/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Run broader linting with reasonable line length
          flake8 joblet/ --max-line-length=88 --extend-ignore=E203,W503 --exclude="joblet_pb2.py,joblet_pb2_grpc.py" --count --show-source --statistics

      - name: Type check with mypy
        run: |
          # Basic type checking on key files
          mypy joblet/__init__.py joblet/client.py joblet/services.py joblet/exceptions.py --ignore-missing-imports || echo "⚠️ Type checking completed with warnings"

      - name: Test with pytest
        run: pytest tests/ -v --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run security checks
      run: |
        # Security linting
        bandit -r joblet/ -ll
        # Dependency vulnerability check
        safety check --ignore 70612 || echo "⚠️ Safety check completed with warnings"

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/